    Share:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - text
        reflection:
          type: object
          properties:
            id:
              type: string
            date:
              type: string
              format: date
            title:
              type: string
            body:
              type: string
          required:
            - id
            - date
            - title
            - body
        text:
          type: string
      required:
        - id
        - createdAt
        - kind
        - reflection
        - text
      additionalProperties: false
    CreateShare:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          description:
            At most 10,000 Unicode code points before trimming; the trimmed
            result must contain non-whitespace text.
      required:
        - text
      additionalProperties: false
      example:
        text: A fictional thought.
