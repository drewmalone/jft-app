name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify code and generated OpenAPI (Spectral)
        run: npm run check
      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openapi
          path: .tmp/openapi.yaml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
