readings:
  - date: '2026-11-11'
    title: A small beginning
    body: |
      Just for today, I can take one useful step without solving everything.
      A pause gives me room to choose how I respond.
  - date: '2026-11-12'
    title: Room to listen
    body: |
      Just for today, I can listen before deciding what comes next.
      I can make space for another person's experience and still honor my own.
